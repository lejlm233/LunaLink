<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e8ff"/>
      <stop offset="1" stop-color="#a8b8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Crescent moon -->
  <circle cx="220" cy="220" r="120" fill="url(#moon)"/>
  <circle cx="270" cy="200" r="110" fill="url(#bg)"/>
  <!-- Link chain nodes -->
  <circle cx="340" cy="340" r="36" fill="none" stroke="#7b9cff" stroke-width="20"/>
  <circle cx="340" cy="340" r="8" fill="#a8b8ff"/>
  <circle cx="400" cy="280" r="24" fill="none" stroke="#7b9cff" stroke-width="16"/>
  <circle cx="400" cy="280" r="6" fill="#a8b8ff"/>
  <!-- Connecting link -->
  <path d="M 360 318 L 380 300" stroke="#7b9cff" stroke-width="16" stroke-linecap="round"/>
</svg>
